<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">DocuExtract invoice processing pipeline</title>
  <desc id="desc">A text-based invoice PDF is processed locally in a browser, reviewed, and exported as XLSX, CSV, or JSON.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1C1B19" stroke-opacity=".07"/></pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF7EF"/><stop offset="1" stop-color="#E8E1D3"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#47BAFF"/></marker>
  </defs>
  <rect width="960" height="600" fill="url(#paper)"/><rect width="960" height="600" fill="url(#grid)"/>
  <path d="M0 118H960" stroke="#1C1B19" stroke-opacity=".16"/>
  <text x="48" y="54" fill="#1C1B19" font-family="monospace" font-size="16" letter-spacing="2">DOCUEXTRACT / DATA PIPELINE</text>
  <text x="48" y="82" fill="#5A564C" font-family="Arial,sans-serif" font-size="13">INVOICE PDF → REVIEW → STRUCTURED EXPORTS</text>
  <rect x="760" y="36" width="150" height="32" rx="4" fill="#E5F4EC" stroke="#1F6B45" stroke-opacity=".4"/><circle cx="778" cy="52" r="4" fill="#1F6B45"/>
  <text x="790" y="56" fill="#1F6B45" font-family="monospace" font-size="11">BROWSER-LOCAL</text>

  <rect x="48" y="166" width="236" height="300" rx="10" fill="#F9F5EB" stroke="#C8431F" stroke-opacity=".6" stroke-width="1.5"/>
  <rect x="68" y="188" width="52" height="62" rx="5" fill="#C8431F"/><path d="M82 204H106M82 215H106M82 226H99" stroke="#FFF6EC" stroke-width="2" stroke-linecap="round"/>
  <text x="68" y="282" fill="#C8431F" font-family="monospace" font-size="11" letter-spacing="1.5">INPUT / 01</text>
  <text x="68" y="312" fill="#1C1B19" font-family="Arial,sans-serif" font-size="23" font-weight="700">Invoice PDF</text>
  <text x="68" y="342" fill="#5A564C" font-family="Arial,sans-serif" font-size="14">Text-based documents</text><path d="M68 365H264" stroke="#1C1B19" stroke-opacity=".15"/>
  <rect x="68" y="385" width="196" height="48" rx="5" fill="#F2EEE3" stroke="#CFC8B6"/><text x="82" y="405" fill="#1C1B19" font-family="monospace" font-size="11">invoice.pdf</text><text x="82" y="421" fill="#5A564C" font-family="Arial,sans-serif" font-size="10">Selected for review</text>

  <path d="M294 315H352" stroke="#47BAFF" stroke-width="2" marker-end="url(#arrow)"/><circle cx="321" cy="315" r="4" fill="#FFD34E"/>
  <rect x="366" y="166" width="236" height="300" rx="10" fill="#101B2D" stroke="#47BAFF" stroke-opacity=".65" stroke-width="1.5"/>
  <rect x="386" y="188" width="196" height="28" rx="4" fill="#192B43"/><circle cx="400" cy="202" r="3.5" fill="#FF6A24"/><circle cx="412" cy="202" r="3.5" fill="#FFD34E"/><circle cx="424" cy="202" r="3.5" fill="#47BAFF"/>
  <text x="386" y="250" fill="#47BAFF" font-family="monospace" font-size="11" letter-spacing="1.5">PROCESS / 02</text><text x="386" y="280" fill="#F8F5ED" font-family="Arial,sans-serif" font-size="21" font-weight="700">Extract &amp; review</text>
  <text x="386" y="309" fill="#C3BDB1" font-family="Arial,sans-serif" font-size="13">Structured invoice fields</text>
  <rect x="386" y="332" width="196" height="30" rx="3" fill="#192B43"/><text x="398" y="351" fill="#C3BDB1" font-family="monospace" font-size="11">INVOICE NUMBER</text>
  <rect x="386" y="369" width="196" height="30" rx="3" fill="#192B43"/><text x="398" y="388" fill="#C3BDB1" font-family="monospace" font-size="11">DATE / TOTAL / ITEMS</text>
  <text x="386" y="434" fill="#FFD34E" font-family="monospace" font-size="11">REVIEW BEFORE EXPORT</text>

  <path d="M612 315H670" stroke="#47BAFF" stroke-width="2" marker-end="url(#arrow)"/><circle cx="641" cy="315" r="4" fill="#FF6A24"/>
  <rect x="684" y="166" width="228" height="300" rx="10" fill="#F9F5EB" stroke="#1F6B45" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="706" y="214" fill="#1F6B45" font-family="monospace" font-size="11" letter-spacing="1.5">OUTPUT / 03</text><text x="706" y="246" fill="#1C1B19" font-family="Arial,sans-serif" font-size="23" font-weight="700">Export formats</text>
  <rect x="706" y="270" width="184" height="46" rx="5" fill="#E5F4EC" stroke="#1F6B45" stroke-opacity=".3"/><rect x="720" y="281" width="24" height="24" rx="3" fill="#1F6B45"/><text x="726" y="297" fill="#FFFFFF" font-family="monospace" font-size="10">X</text><text x="758" y="289" fill="#1C1B19" font-family="Arial,sans-serif" font-size="14" font-weight="700">XLSX</text><text x="758" y="304" fill="#5A564C" font-family="Arial,sans-serif" font-size="10">Full invoice</text>
  <rect x="706" y="326" width="184" height="46" rx="5" fill="#E5F1FA" stroke="#47BAFF" stroke-opacity=".4"/><rect x="720" y="337" width="24" height="24" rx="3" fill="#1976B8"/><text x="726" y="353" fill="#FFFFFF" font-family="monospace" font-size="10">C</text><text x="758" y="345" fill="#1C1B19" font-family="Arial,sans-serif" font-size="14" font-weight="700">CSV</text><text x="758" y="360" fill="#5A564C" font-family="Arial,sans-serif" font-size="10">Line items</text>
  <rect x="706" y="382" width="184" height="46" rx="5" fill="#FFF4D6" stroke="#D5A928" stroke-opacity=".6"/><rect x="720" y="393" width="24" height="24" rx="3" fill="#C09118"/><text x="726" y="409" fill="#FFFFFF" font-family="monospace" font-size="10">J</text><text x="758" y="401" fill="#1C1B19" font-family="Arial,sans-serif" font-size="14" font-weight="700">JSON</text><text x="758" y="416" fill="#5A564C" font-family="Arial,sans-serif" font-size="10">Full invoice</text>
  <path d="M48 506H912" stroke="#1C1B19" stroke-opacity=".16"/><text x="48" y="540" fill="#5A564C" font-family="monospace" font-size="12" letter-spacing="1">NO BACKEND REQUIRED BY THE APP</text>
  <text x="48" y="563" fill="#5A564C" font-family="Arial,sans-serif" font-size="12">Extraction is heuristic. Review data before accounting, tax, payment, or legal use.</text>
</svg>